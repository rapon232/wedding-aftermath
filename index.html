<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%meta.headTitle%%</title>
    <meta name="theme-color" content="#7b2d42" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Link preview (WhatsApp / iMessage / etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%publicUrl%%/" />
    <meta property="og:title" content="%%meta.ogTitle%%" />
    <meta property="og:description" content="%%meta.ogDesc%%" />
    <meta property="og:image" content="%%publicUrl%%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%%publicUrl%%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%%meta.ogImageAlt%%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%meta.ogTitle%%" />
    <meta name="twitter:description" content="%%meta.ogDesc%%" />
    <meta name="twitter:image" content="%%publicUrl%%/og-image.jpg" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Self-heal a stale shell: if the hashed CSS/JS this page references are
      // gone (a redeploy replaced them) the page renders bare and Safari never
      // retries — reload once to fetch fresh HTML. A sessionStorage flag stops
      // a genuinely-down site from reload-looping; it re-arms on a good load.
      (function () {
        var KEY = 'shell-reloaded';
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          location.reload();
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            var url = t.href || t.src || '';
            if ((t.tagName === 'LINK' || t.tagName === 'SCRIPT') && url.indexOf('/assets/') !== -1) recover();
          },
          true, // resource load errors don't bubble; they are visible in the capture phase
        );
        window.addEventListener('load', function () {
          // Belt-and-suspenders for resumed tabs where the error event predates the
          // listener. Only meaningful on built pages (dev serves no /assets/ link).
          var link = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
          if (!link) return;
          if (link.sheet && link.sheet.cssRules.length) {
            try {
              sessionStorage.removeItem(KEY);
            } catch (e) {}
          } else {
            recover();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div class="wrapper">
      <header class="site-header">
        <div class="header-text">
          <h1>
            %%t.brand%% <span class="nowrap"><em>%%t.brandEm%%</em> <span class="heart">%%suit%%</span></span>
          </h1>
          <p id="welcome" class="header-sub"></p>
        </div>
        <div class="header-actions">
          <button id="uploadBtn" class="btn btn-bx">%%t.upload%%</button>
          <button id="noteBtn" class="btn btn-ghost">%%t.leaveNote%%</button>
          <button id="adminBtn" class="btn btn-ghost" hidden>%%t.guests%%</button>
          <button id="logoutBtn" class="btn btn-ghost">%%t.signOut%%</button>
        </div>
      </header>

      <div class="toolbar">
        <div class="seg" id="typeSeg" role="group" aria-label="%%t.mediaType%%">
          <button data-type="" class="active">%%t.all%%</button>
          <button data-type="photo">%%t.photos%%</button>
          <button data-type="video">%%t.videos%%</button>
        </div>
        <select id="uploaderSel" aria-label="%%t.filterByUploader%%">
          <option value="">%%t.everyone%%</option>
        </select>
        <select id="sortSel" aria-label="%%t.sortOrder%%">
          <option value="taken-desc">%%t.sortNewest%%</option>
          <option value="taken-asc">%%t.sortOldest%%</option>
          <option value="uploaded-desc">%%t.sortRecent%%</option>
          <option value="loved">%%t.sortLoved%%</option>
          <option value="commented">%%t.sortTalked%%</option>
        </select>
        <button id="clearFilters" class="btn-tool" hidden>%%t.clearFilters%%</button>
        <button id="selectBtn" class="btn-tool">%%t.select%%</button>
        <button id="downloadAllBtn" class="btn-tool">%%t.downloadAll%%</button>
        <span id="countLabel" class="count-label"></span>
      </div>

      <div class="select-bar" id="selectBar" hidden>
        <span id="selCount"></span>
        <button id="selAllBtn" class="btn-tool">%%t.selectLoaded%%</button>
        <button id="selDownloadBtn" class="btn btn-bx">%%t.download%%</button>
        <button id="selDeleteBtn" class="btn-tool btn-danger" hidden>%%t.delete%%</button>
        <button id="selCancelBtn" class="btn-tool">%%t.cancel%%</button>
      </div>

      <div id="uploadHint" class="upload-hint" hidden>
        <span>%%t.uploadHintHtml%%</span>
        <button id="hintDismiss" class="hint-dismiss" aria-label="%%t.dismiss%%">✕</button>
      </div>

      <button id="newBanner" class="new-banner" hidden></button>

      <main id="gallery" class="gallery">
        <p class="gallery-empty" id="galleryEmpty">%%t.loading%%</p>
      </main>
      <div id="sentinel"></div>
    </div>

    <aside id="uploadTray" class="upload-tray" hidden></aside>
    <div class="drop-overlay">
      <div class="drop-overlay-inner">%%t.dropOverlay%%</div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
