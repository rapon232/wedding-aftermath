<!doctype html>
<html lang="%%lang%%">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%%meta.loginHeadTitle%%</title>
    <meta name="theme-color" content="#f7f3ee" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Link preview (WhatsApp / iMessage / etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%%publicUrl%%/" />
    <meta property="og:title" content="%%meta.ogTitle%%" />
    <meta property="og:description" content="%%meta.ogDesc%%" />
    <meta property="og:image" content="%%publicUrl%%/og-image.jpg" />
    <meta property="og:image:secure_url" content="%%publicUrl%%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%%meta.ogImageAlt%%" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%%meta.ogTitle%%" />
    <meta name="twitter:description" content="%%meta.ogDesc%%" />
    <meta name="twitter:image" content="%%publicUrl%%/og-image.jpg" />
    <meta name="description" content="%%meta.ogDesc%%" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Self-heal a stale shell: if the hashed CSS/JS this page references are
      // gone (a redeploy replaced them) the page renders bare and Safari never
      // retries — reload once to fetch fresh HTML. A sessionStorage flag stops
      // a genuinely-down site from reload-looping; it re-arms on a good load.
      (function () {
        var KEY = 'shell-reloaded';
        function recover() {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          location.reload();
        }
        window.addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (!t || !t.tagName) return;
            var url = t.href || t.src || '';
            if ((t.tagName === 'LINK' || t.tagName === 'SCRIPT') && url.indexOf('/assets/') !== -1) recover();
          },
          true, // resource load errors don't bubble; they are visible in the capture phase
        );
        window.addEventListener('load', function () {
          // Belt-and-suspenders for resumed tabs where the error event predates the
          // listener. Only meaningful on built pages (dev serves no /assets/ link).
          var link = document.querySelector('link[rel="stylesheet"][href*="/assets/"]');
          if (!link) return;
          if (link.sheet && link.sheet.cssRules.length) {
            try {
              sessionStorage.removeItem(KEY);
            } catch (e) {}
          } else {
            recover();
          }
        });
      })();
    </script>
  </head>
  <body>
    <main class="login-wrap">
      <div class="login-card">
        <div class="pill-tag">%%t.loginPill%%</div>
        <h1 class="login-title">
          %%t.loginBrand%%
          <span class="nowrap"><em>%%t.brandEm%%</em> <span class="heart">%%suit%%</span></span>
        </h1>
        <p class="login-sub" id="loginSub">%%t.loginSub%%</p>
        <form id="loginForm" autocomplete="off">
          <input
            id="codeInput"
            class="code-input"
            type="text"
            inputmode="text"
            autocapitalize="characters"
            spellcheck="false"
            placeholder="XXXX-XXXX"
            maxlength="9"
            aria-label="%%t.codeAria%%"
          />
          <p id="loginError" class="login-error" hidden></p>
          <div id="profileFields" hidden>
            <input
              id="nameInput"
              class="code-input profile-input"
              type="text"
              maxlength="80"
              placeholder="%%t.regName%%"
              autocomplete="name"
              autocapitalize="words"
            />
            <input
              id="emailInput"
              class="code-input profile-input"
              type="email"
              maxlength="200"
              placeholder="%%t.regEmail%%"
              autocomplete="email"
            />
            <p class="reg-note">%%t.regPrivacy%%</p>
          </div>
          <button type="submit" class="btn btn-bx" id="loginBtn">%%t.enterGallery%%</button>
        </form>
        <p class="login-help">%%t.lostCodeHtml%%</p>
        <div id="langSwitch"></div>
      </div>
    </main>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
